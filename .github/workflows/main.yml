# File: NyxExecutor/.github/workflows/ios-build.yml
name: Nyx iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'

    - name: Install Theos and ldid
      run: |
        brew install ldid
        export THEOS=/opt/theos
        sudo mkdir -p $THEOS
        sudo chown -R $USER $THEOS
        git clone --recursive https://github.com/theos/theos.git $THEOS || \
        (curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash)
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Build Nyx Tweak
      run: |
        cd NyxExecutor/NyxTweak
        make package

    - name: Upload DEB
      uses: actions/upload-artifact@v4
      with:
        name: Nyx-iOS-Executor
        path: NyxExecutor/NyxTweak/packages/*.dylib